spring.application.name=SBMS-11-ApiGateway
server.port=9191

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webmvc.routes[0].id=Student-Service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8888/
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/student

spring.cloud.gateway.server.webmvc.routes[1].id=Course-Service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:9999/
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/course